name: Daily downloads

# Each day's downloads of the newest release's files, in downloads.csv
# (.github/record_downloads.py). Commits only when a count changes, or a new day starts.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: downloads

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Write today's downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${{ github.repository }}/releases/latest > "$RUNNER_TEMP/release.json"
          python3 .github/record_downloads.py "$RUNNER_TEMP/release.json" downloads.csv
      - name: Commit
        run: |
          git add downloads.csv
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "Downloads on $(TZ=America/New_York date +%F)"
          git push
